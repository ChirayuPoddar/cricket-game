<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D Cricket Game</title>
    <link rel="stylesheet" href="css/style.css?v=49">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/cannon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.17.0/meshopt_decoder.js"></script>
</head>
<body>
    <div id="loadingOverlay">
        <div id="loadingSpinner"></div>
        <h1 class="loading-title">3D CRICKET GAME</h1>
        <p id="loadingStatus">Loading stadium and assets: 0%</p>
        
        <!-- Progress bar container -->
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <button id="startGameBtn">Start Game 🏏</button>
    </div>

    <video id="webcamOverlay" autoplay playsinline></video>

    <!-- Live Field Radar Overlay -->
    <div id="fieldRadar">
        <!-- Header -->
        <div class="radar-header">
            🛰️ Live Field Radar
        </div>
        <!-- Canvas -->
        <canvas id="radarCanvas" width="240" height="240"></canvas>
    </div>

    <canvas id="renderCanvas"></canvas>

    <!-- Pause Menu Modal Popup -->
    <div id="pauseModal">
        <div class="modal-content">
            <div id="pauseMenuContent">
                <h2 class="modal-title">Paused ⏸</h2>
                <button id="modalDayNightBtn" class="modal-btn">🌙 Switch to Night</button>
                <button id="modalResetBtn" class="modal-btn">🔄 Reset Match</button>
                <button id="modalResumeBtn" class="modal-btn">▶ Resume Game</button>
            </div>
            <div id="pauseCountdownContent">
                <h2 class="modal-title countdown-label" id="countdownLabel">Get Ready</h2>
                <div id="countdownNumber" class="countdown-number">3</div>
            </div>
        </div>
    </div>

    <!-- Main Entry Point Module -->
    <script type="module" src="src/script.js?v=66"></script>
</body>
</html>
